name: SiteHub SearchOps complete p44 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sitehub-searchops-complete-once.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply complete SiteHub contract
        env:
          PROJECT_ID: p44
          PUBLIC_URL: https://websquare.suaveforge.com/
          PROJECT_NAME: KCMS WebSquare 금융시장 인프라 서비스
          DESCRIPTION: KCMS WebSquare는 금융시장 인프라 업무 화면을 WebSquare 런타임으로 제공하고 주요 업무 흐름을 확인하는 웹 시스템입니다.
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/suaveforge/sitehub-deploy/8289fa3e45143954bda73514ad6fd3667d90891d/searchops/static-complete-adapter.py -o /tmp/sitehub.py
          python /tmp/sitehub.py
          git config user.name 'SuaveForge SiteHub'; git config user.email '53187583+programmer119@users.noreply.github.com'
          git add index.html sitemap.xml robots.txt
          if ! git diff --cached --quiet; then git commit -m 'Apply SiteHub SearchOps p44'; git push; fi
